name: Orquestador Diario Canasta Básica

on:
  schedule:
    # Ejecuta todos los días a las 10:00 UTC (06:00 AM Hora de Chile Invierno UTC-4)
    - cron: '0 10 * * *'
  workflow_dispatch: # Te permite agregar un botón en GitHub para ejecutarlo a mano cuando quieras

jobs:
  extraccion-y-lakehouse:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Clonar repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Ejecutar Orquestador Productivo
        env:
          ENV: prod
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          python orquestador_diario.py