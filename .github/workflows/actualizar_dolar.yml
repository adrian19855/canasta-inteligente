name: Actualizar Dolar Diario

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1-5' # De lunes a viernes a las 08:00 UTC

jobs:
  run-dolar:
    runs-on: ubuntu-latest
    steps:
      - name: Copiar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install duckdb pandas requests

      - name: Ejecutar carga de Dólar
        run: python cargar_diario.py

      - name: Configurar Git y subir cambios
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git status
          git add canasta.duckdb
          git commit -m "Actualización automática de Dólar [skip ci]" || echo "No hay cambios"
          git push origin main