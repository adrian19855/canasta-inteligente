name: Orquestador Diario - Canasta Completa (Bronze)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'

jobs:
  pipeline-maestro:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librerías
        run: pip install duckdb requests

      - name: Ejecutar Ingesta Jumbo
        run: python scraping_jumbo_bronze.py

      - name: Guardar base de datos consolidada
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add canasta.duckdb
          git commit -m "🛒 Carga diaria consolidada: Canasta Básica Jumbo [skip ci]" || echo "Sin cambios por guardar"
          git pull origin main --rebase
          git push origin main