name: Actualizar Canasta Automatica

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Copiar repositorio en el servidor de GitHub
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install duckdb pandas requests

      - name: Ejecutar script de procesamiento de datos
        run: python prueba_duckdb.py