name: Scraping Diario - Jumbo (Bronze)

on:
  workflow_dispatch:          # Permite ejecutarlo manualmente desde GitHub cuando quieras
  schedule:
    - cron: '0 7 * * *'       # Todos los días a las 07:00 UTC (03:00 AM Chile)

jobs:
  capturar-jumbo:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio (Checkout)
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librerías necesarias
        run: |
          pip install duckdb requests

      - name: Ejecutar Pipeline de Jumbo
        run: |
          python scraping_jumbo_bronze.py

      - name: Configurar Git y subir cambios a la base de datos
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git status
          git add canasta.duckdb
          git commit -m "🛒 Carga automática Canasta Jumbo [skip ci]" || echo "No hay cambios en la base de datos"
          git push origin main